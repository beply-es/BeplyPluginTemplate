name: Release Plugin

on:
  push:
    tags: ['v*']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: beplyplugintemplate-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  verify_tests:
    name: Verify Tests Workflow
    uses: ./.github/workflows/reusable-release-tag-gate.yml
    with:
      expected_repo: beply-es/BeplyPluginTemplate
      expected_jobs: '["Quality Contract","Lint FS v2026.3","Lint FS v2026.2","Unit FS v2026.3 PHP 8.2","Unit FS v2026.2 PHP 8.2","Runtime FS v2026.3 PHP 8.2","Runtime FS v2026.2 PHP 8.2","E2E FS v2026.3","E2E FS v2026.2","Upload Coverage"]'
      optional_jobs: '["PHP 8.4 Compatibility"]'

  docs_release_audit:
    name: Documentation Release Audit
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    needs: verify_tests
    timeout-minutes: 12
    runs-on: ${{ vars.BEPLY_GHA_RUNNER == 'arc-runner-prio' && 'arc-runner-prio' || 'arc-runner-set' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: AI docs impact audit for immutable release tag
        env:
          BEPLY_DOCS_AI_API_KEY: ${{ secrets.BEPLY_DOCS_AI_API_KEY }}
          BEPLY_DOCS_AI_MODEL: ${{ secrets.BEPLY_DOCS_AI_MODEL }}
          BEPLY_DOCS_AI_PROVIDER: ${{ secrets.BEPLY_DOCS_AI_PROVIDER || 'openai' }}
        run: node scripts/ci/validate-docs-impact.mjs --require-ai

  publish_immutable_candidate:
    name: Publish One Candidate And Validate Same Bytes In DEV
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    needs: docs_release_audit
    uses: ./.github/workflows/reusable-immutable-plugin-candidate.yml
    with:
      contract_sha: ${{ github.sha }}
      release_track: main
      # A local call can never satisfy a tag-publisher trust root (it requires
      # `uses: beply-es/BeplyPluginTemplate/...@<allowlisted sha40>`), so the
      # template itself uploads the carrier but does not claim provenance.
      submit_source_provenance: false
    secrets:
      BEPLY_DEV_CI_TOKEN: ${{ secrets.BEPLY_DEV_CI_TOKEN }}
      BEPLY_DEV_PLUGIN_ARTIFACT_SIGNING_PRIVATE_KEY: ${{ secrets.BEPLY_DEV_PLUGIN_ARTIFACT_SIGNING_PRIVATE_KEY }}
      BEPLY_DEV_PLUGIN_ARTIFACT_SIGNATURE_KEY_ID: ${{ secrets.BEPLY_DEV_PLUGIN_ARTIFACT_SIGNATURE_KEY_ID }}
