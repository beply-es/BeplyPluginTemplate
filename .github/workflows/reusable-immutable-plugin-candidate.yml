name: Reusable Immutable Plugin Candidate

on:
  workflow_call:
    inputs:
      contract_sha:
        description: Exact BeplyPluginTemplate commit that owns this contract
        required: true
        type: string
      dev_api_url:
        description: DEV platform API origin
        required: false
        default: https://api.services.devbeply.es
        type: string
      release_track:
        description: Exact catalog release track
        required: false
        default: main
        type: string
      dev_artifact_prefix:
        description: DEV artifact attestation prefix
        required: false
        default: plugins/dev
        type: string
      caller_job_key:
        description: Key of the caller job that invokes this workflow (manifest source.publisherJobKey)
        required: false
        default: publish_immutable_candidate
        type: string
      submit_source_provenance:
        description: Send the beply-plugin-source-provenance-v1 locator with the DEV upload; the platform fails closed when it cannot verify it
        required: false
        default: true
        type: boolean
      source_provenance_environment:
        description: Platform environment that verifies the source provenance locator (dev or production)
        required: false
        default: dev
        type: string
    secrets:
      BEPLY_DEV_CI_TOKEN:
        required: true
      BEPLY_DEV_PLUGIN_ARTIFACT_SIGNING_PRIVATE_KEY:
        required: false
      BEPLY_DEV_PLUGIN_ARTIFACT_SIGNATURE_KEY_ID:
        required: false
    outputs:
      plugin_name:
        value: ${{ jobs.publish.outputs.plugin_name }}
      plugin_version:
        value: ${{ jobs.publish.outputs.plugin_version }}
      plugin_id:
        value: ${{ jobs.publish.outputs.plugin_id }}
      version_id:
        value: ${{ jobs.publish.outputs.version_id }}
      candidate_kind:
        value: ${{ jobs.publish.outputs.candidate_kind }}
      submission_id:
        value: ${{ jobs.publish.outputs.submission_id }}
      checksum:
        value: ${{ jobs.publish.outputs.checksum }}
      file_size:
        value: ${{ jobs.publish.outputs.file_size }}
      release_tag:
        value: ${{ jobs.publish.outputs.release_tag }}
      source_sha:
        value: ${{ jobs.publish.outputs.source_sha }}
      candidate_evidence_json:
        value: ${{ jobs.publish.outputs.candidate_evidence_json }}
      source_provenance_artifact_id:
        value: ${{ jobs.source_provenance.outputs.artifact_id }}
      source_provenance_publisher_job_id:
        value: ${{ jobs.source_provenance.outputs.publisher_job_id }}
      source_provenance_manifest_sha256:
        value: ${{ jobs.source_provenance.outputs.manifest_sha256 }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # The platform verifier (tag-publisher trust root) reads THIS job at the
  # allowlisted template SHA: its key, its name, and exactly one upload step
  # named "Upload plugin source provenance carrier" using
  # actions/upload-artifact@<sha40> with the literal artifact name below. The
  # POST lives in a separate job that `needs:` this one, so the publisher job is
  # already completed/success when the platform reads the run jobs API.
  source_provenance:
    name: Publish Immutable Release And Source Provenance Carrier
    runs-on: ${{ vars.BEPLY_GHA_RUNNER || 'arc-runner-set' }}
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    outputs:
      plugin_name: ${{ steps.ini.outputs.name }}
      plugin_version: ${{ steps.ini.outputs.version }}
      checksum: ${{ steps.measure.outputs.checksum }}
      file_size: ${{ steps.measure.outputs.file_size }}
      source_published_at: ${{ steps.release_metadata.outputs.source_published_at }}
      publisher_job_id: ${{ steps.provenance_manifest.outputs.publisher_job_id }}
      manifest_sha256: ${{ steps.provenance_manifest.outputs.manifest_sha256 }}
      artifact_id: ${{ steps.provenance_carrier.outputs.artifact-id }}
    steps:
      - name: Install pinned GitHub CLI
        env:
          GH_CLI_VERSION: 2.96.0
          GH_CLI_ARCHIVE: gh_2.96.0_linux_arm64.tar.gz
          GH_CLI_SHA256: 06f86ec7103d41993b76cd78072f43595c34aaa56506d971d9860e67140bf909
        run: |
          set -euo pipefail
          archive="${GH_CLI_ARCHIVE}"
          archive_path="${RUNNER_TEMP}/${archive}"
          curl -fsSL \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/${archive}" \
            -o "${archive_path}"
          printf '%s  %s\n' "${GH_CLI_SHA256}" "${archive_path}" | sha256sum -c -
          tar -xzf "${archive_path}" -C "${RUNNER_TEMP}"
          install -d "${RUNNER_TEMP}/gh-bin"
          install -m 0755 \
            "${RUNNER_TEMP}/gh_${GH_CLI_VERSION}_linux_arm64/bin/gh" \
            "${RUNNER_TEMP}/gh-bin/gh"
          printf '%s\n' "${RUNNER_TEMP}/gh-bin" >> "${GITHUB_PATH}"

      - name: Checkout caller plugin at exact source SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: plugin
          fetch-depth: 0

      - name: Checkout immutable promotion contract
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: beply-es/BeplyPluginTemplate
          ref: ${{ inputs.contract_sha }}
          path: contract

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24"

      - name: Validate immutable caller and contract identities
        env:
          CONTRACT_SHA: ${{ inputs.contract_sha }}
          RELEASE_TRACK: ${{ inputs.release_track }}
          CALLER_JOB_KEY: ${{ inputs.caller_job_key }}
        run: |
          set -euo pipefail
          case "${CONTRACT_SHA}" in ????????????????????????????????????????) ;; *) echo "::error::contract_sha must be 40 hex"; exit 1;; esac
          case "${CONTRACT_SHA}" in *[!0-9a-f]*) echo "::error::contract_sha must be lowercase hex"; exit 1;; esac
          test "$(git -C contract rev-parse HEAD)" = "${CONTRACT_SHA}" || { echo "::error::contract checkout mismatch"; exit 1; }
          test "$(git -C plugin rev-parse HEAD)" = "${GITHUB_SHA}" || { echo "::error::caller source SHA mismatch"; exit 1; }
          # push = publish a new immutable candidate; workflow_dispatch on the tag ref =
          # provenance only (reuse the published release, never create one).
          case "${GITHUB_EVENT_NAME}" in push|workflow_dispatch) ;; *) echo "::error::candidate must originate from a tag push or a provenance-only dispatch on the tag"; exit 1;; esac
          test "${GITHUB_REF_TYPE}" = "tag" || { echo "::error::candidate requires an immutable tag"; exit 1; }
          test "${GITHUB_REF}" = "refs/tags/${GITHUB_REF_NAME}" || { echo "::error::candidate ref must be the pushed tag"; exit 1; }
          test "${RELEASE_TRACK}" = "main" || { echo "::error::release track must be exactly main"; exit 1; }
          [[ "${CALLER_JOB_KEY}" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || { echo "::error::caller_job_key is invalid"; exit 1; }

      - name: Verify release tag peels to the run commit
        run: |
          set -euo pipefail
          # Re-read the tag from origin: an annotated or lightweight tag must
          # peel to exactly the commit this run builds, or nothing is published.
          git -C plugin fetch --force --no-tags origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          PEELED="$(git -C plugin rev-parse --verify "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          test "${PEELED}" = "${GITHUB_SHA}" || { echo "::error::release tag does not peel to the run commit"; exit 1; }

      - name: Parse and validate plugin identity
        id: ini
        working-directory: plugin
        run: |
          set -euo pipefail
          parse_field() {
            grep -E "^$1\\s*=" facturascripts.ini | head -1 | sed 's/^[^=]*=[ ]*//' | tr -d '"\r' | xargs
          }
          NAME="$(parse_field name)"
          VERSION="$(parse_field version)"
          test -n "${NAME}" && test -n "${VERSION}"
          test "${GITHUB_REF_NAME}" = "v${VERSION}" || { echo "::error::tag/version mismatch"; exit 1; }
          {
            echo "name=${NAME}"
            echo "version=${VERSION}"
          } >> "${GITHUB_OUTPUT}"

      - name: Resolve immutable release asset state
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          ASSET_NAME: ${{ steps.ini.outputs.name }}-v${{ steps.ini.outputs.version }}.zip
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/releases/tags/{os.environ['RELEASE_TAG']}",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "beply-plugin-immutable-candidate",
              },
          )
          try:
              with urllib.request.urlopen(request) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                      output.write("exists=false\n")
                  sys.exit(0)
              print(f"release lookup failed with HTTP {exc.code}", file=sys.stderr)
              sys.exit(1)
          if payload.get("draft") is not False:
              print("existing immutable release is draft", file=sys.stderr)
              sys.exit(1)
          matching = [asset for asset in payload.get("assets", []) if asset.get("name") == os.environ["ASSET_NAME"]]
          if len(matching) != 1 or int(matching[0].get("size", 0)) <= 0:
              print("existing immutable release does not contain exactly one non-empty canonical asset", file=sys.stderr)
              sys.exit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("exists=true\n")
          PY

      - name: Require a published release for provenance-only dispatch
        if: github.event_name == 'workflow_dispatch' && steps.release.outputs.exists != 'true'
        run: |
          echo "::error::provenance-only dispatch requires an already published release for ${GITHUB_REF_NAME}"
          exit 1

      - name: Build plugin ZIP exactly once
        id: build
        run: >-
          python3 contract/scripts/ci/build_plugin_zip.py
          --plugin-root plugin
          --plugin-name "${{ steps.ini.outputs.name }}"
          --plugin-version "${{ steps.ini.outputs.version }}"
          --output "/tmp/build/${{ steps.ini.outputs.name }}-v${{ steps.ini.outputs.version }}.zip"

      - name: Create immutable GitHub Release asset
        if: steps.release.outputs.exists != 'true' && github.event_name == 'push'
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.ini.outputs.name }} ${{ github.ref_name }}
          generate_release_notes: true
          files: /tmp/build/${{ steps.ini.outputs.name }}-v${{ steps.ini.outputs.version }}.zip

      - name: Download the published asset and byte-compare it with the deterministic build
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_NAME: ${{ steps.ini.outputs.name }}-v${{ steps.ini.outputs.version }}.zip
        run: |
          set -euo pipefail
          # New or reused, the asset the manifest attests must be exactly the bytes the
          # reviewed builder produces from GITHUB_SHA; a hand-uploaded or pre-staged
          # asset fails closed here.
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${ASSET_NAME}" \
            --dir /tmp
          cmp "/tmp/build/${ASSET_NAME}" "/tmp/${ASSET_NAME}" || { echo "::error::published release asset differs from the deterministic build"; exit 1; }

      - name: Resolve canonical GitHub Release publication timestamp
        id: release_metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          SOURCE_PUBLISHED_AT=""
          for attempt in 1 2 3 4 5; do
            SOURCE_PUBLISHED_AT="$(gh api \
              "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
              --jq '.published_at // empty' 2>/dev/null || true)"
            if [[ "${SOURCE_PUBLISHED_AT}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
              break
            fi
            sleep 2
          done
          [[ "${SOURCE_PUBLISHED_AT}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] || { echo "::error::GitHub Release published_at is missing or invalid"; exit 1; }
          echo "source_published_at=${SOURCE_PUBLISHED_AT}" >> "${GITHUB_OUTPUT}"

      - name: Measure exact immutable asset
        id: measure
        env:
          ASSET: /tmp/${{ steps.ini.outputs.name }}-v${{ steps.ini.outputs.version }}.zip
        run: |
          set -euo pipefail
          test -s "${ASSET}"
          {
            echo "checksum=sha256:$(sha256sum "${ASSET}" | awk '{print $1}')"
            echo "file_size=$(stat -c %s "${ASSET}")"
          } >> "${GITHUB_OUTPUT}"

      - name: Build source provenance manifest
        id: provenance_manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLUGIN_ROOT: plugin
          PLUGIN_ZIP: /tmp/${{ steps.ini.outputs.name }}-v${{ steps.ini.outputs.version }}.zip
          PLUGIN_NAME: ${{ steps.ini.outputs.name }}
          PLUGIN_VERSION: ${{ steps.ini.outputs.version }}
          MANIFEST_DIR: ${{ runner.temp }}/plugin-source-provenance
          CALLER_JOB_KEY: ${{ inputs.caller_job_key }}
          PUBLISHER_JOB_NAME: Publish Immutable Release And Source Provenance Carrier
        run: node contract/scripts/ci/build_source_provenance_manifest.mjs

      - name: Upload plugin source provenance carrier
        id: provenance_carrier
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-source-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.provenance_manifest.outputs.manifest_path }}
          if-no-files-found: error

      - name: Validate source provenance carrier identity
        env:
          ARTIFACT_ID: ${{ steps.provenance_carrier.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.provenance_carrier.outputs.artifact-digest }}
          PUBLISHER_JOB_ID: ${{ steps.provenance_manifest.outputs.publisher_job_id }}
        run: |
          set -euo pipefail
          [[ "${ARTIFACT_ID}" =~ ^[1-9][0-9]{0,15}$ ]] || { echo "::error::carrier artifact id is missing"; exit 1; }
          [[ "${PUBLISHER_JOB_ID}" =~ ^[1-9][0-9]{0,15}$ ]] || { echo "::error::publisher job id is missing"; exit 1; }
          [[ "${ARTIFACT_DIGEST}" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::carrier artifact digest is missing"; exit 1; }

  publish:
    name: Publish One Immutable Candidate And Upload Same Bytes To DEV
    needs: source_provenance
    runs-on: ${{ vars.BEPLY_GHA_RUNNER || 'arc-runner-set' }}
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      plugin_name: ${{ needs.source_provenance.outputs.plugin_name }}
      plugin_version: ${{ needs.source_provenance.outputs.plugin_version }}
      plugin_id: ${{ steps.upload_dev.outputs.plugin_id }}
      version_id: ${{ steps.upload_dev.outputs.version_id }}
      candidate_kind: ${{ steps.upload_dev.outputs.candidate_kind }}
      submission_id: ${{ steps.upload_dev.outputs.submission_id }}
      checksum: ${{ needs.source_provenance.outputs.checksum }}
      file_size: ${{ needs.source_provenance.outputs.file_size }}
      release_tag: ${{ github.ref_name }}
      source_sha: ${{ github.sha }}
      candidate_evidence_json: ${{ steps.upload_dev.outputs.candidate_evidence_json }}
    steps:
      - name: Install pinned GitHub CLI
        env:
          GH_CLI_VERSION: 2.96.0
          GH_CLI_ARCHIVE: gh_2.96.0_linux_arm64.tar.gz
          GH_CLI_SHA256: 06f86ec7103d41993b76cd78072f43595c34aaa56506d971d9860e67140bf909
        run: |
          set -euo pipefail
          archive="${GH_CLI_ARCHIVE}"
          archive_path="${RUNNER_TEMP}/${archive}"
          curl -fsSL \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/${archive}" \
            -o "${archive_path}"
          printf '%s  %s\n' "${GH_CLI_SHA256}" "${archive_path}" | sha256sum -c -
          tar -xzf "${archive_path}" -C "${RUNNER_TEMP}"
          install -d "${RUNNER_TEMP}/gh-bin"
          install -m 0755 \
            "${RUNNER_TEMP}/gh_${GH_CLI_VERSION}_linux_arm64/bin/gh" \
            "${RUNNER_TEMP}/gh-bin/gh"
          printf '%s\n' "${RUNNER_TEMP}/gh-bin" >> "${GITHUB_PATH}"

      - name: Checkout immutable promotion contract
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: beply-es/BeplyPluginTemplate
          ref: ${{ inputs.contract_sha }}
          path: contract

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24"

      - name: Validate immutable contract and provenance inputs
        env:
          CONTRACT_SHA: ${{ inputs.contract_sha }}
          SOURCE_PROVENANCE_ENVIRONMENT: ${{ inputs.source_provenance_environment }}
        run: |
          set -euo pipefail
          test "$(git -C contract rev-parse HEAD)" = "${CONTRACT_SHA}" || { echo "::error::contract checkout mismatch"; exit 1; }
          test "${GITHUB_REF_TYPE}" = "tag" || { echo "::error::candidate requires an immutable tag"; exit 1; }
          case "${SOURCE_PROVENANCE_ENVIRONMENT}" in dev|production) ;; *) echo "::error::source_provenance_environment must be dev or production"; exit 1;; esac

      - name: Download the exact immutable release asset published by the carrier job
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_NAME: ${{ needs.source_provenance.outputs.plugin_name }}-v${{ needs.source_provenance.outputs.plugin_version }}.zip
          EXPECTED_CHECKSUM: ${{ needs.source_provenance.outputs.checksum }}
          EXPECTED_FILE_SIZE: ${{ needs.source_provenance.outputs.file_size }}
        run: |
          set -euo pipefail
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${ASSET_NAME}" \
            --dir /tmp
          test "sha256:$(sha256sum "/tmp/${ASSET_NAME}" | awk '{print $1}')" = "${EXPECTED_CHECKSUM}" || { echo "::error::release asset checksum drift"; exit 1; }
          test "$(stat -c %s "/tmp/${ASSET_NAME}")" = "${EXPECTED_FILE_SIZE}" || { echo "::error::release asset size drift"; exit 1; }

      - name: Generate DEV artifact attestation from immutable bytes
        id: attestation
        env:
          PLUGIN_NAME: ${{ needs.source_provenance.outputs.plugin_name }}
          PLUGIN_VERSION: ${{ needs.source_provenance.outputs.plugin_version }}
          PLUGIN_ZIP: /tmp/${{ needs.source_provenance.outputs.plugin_name }}-v${{ needs.source_provenance.outputs.plugin_version }}.zip
          PLUGIN_RELEASE_TRACK: ${{ inputs.release_track }}
          PLUGIN_ARTIFACT_PREFIX: ${{ inputs.dev_artifact_prefix }}
          SOURCE_REPO_FULL_NAME: ${{ github.repository }}
          SOURCE_RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          PLUGIN_ARTIFACT_SIGNING_PRIVATE_KEY: ${{ secrets.BEPLY_DEV_PLUGIN_ARTIFACT_SIGNING_PRIVATE_KEY }}
          PLUGIN_ARTIFACT_SIGNATURE_KEY_ID: ${{ secrets.BEPLY_DEV_PLUGIN_ARTIFACT_SIGNATURE_KEY_ID }}
        run: node contract/scripts/ci/build_plugin_artifact_attestation.mjs

      - name: Upload exact immutable bytes to DEV pending canonical approval
        id: upload_dev
        env:
          BEPLY_API_URL: ${{ inputs.dev_api_url }}
          BEPLY_CI_TOKEN: ${{ secrets.BEPLY_DEV_CI_TOKEN }}
          PLUGIN_NAME: ${{ needs.source_provenance.outputs.plugin_name }}
          PLUGIN_VERSION: ${{ needs.source_provenance.outputs.plugin_version }}
          CHECKSUM: ${{ needs.source_provenance.outputs.checksum }}
          FILE_SIZE: ${{ needs.source_provenance.outputs.file_size }}
          RELEASE_TRACK: ${{ inputs.release_track }}
          HAS_ATTESTATION: ${{ steps.attestation.outputs.has_attestation }}
          SOURCE_PUBLISHED_AT: ${{ needs.source_provenance.outputs.source_published_at }}
          SUBMIT_SOURCE_PROVENANCE: ${{ inputs.submit_source_provenance }}
          SOURCE_PROVENANCE_ENVIRONMENT: ${{ inputs.source_provenance_environment }}
          MANIFEST_ARTIFACT_ID: ${{ needs.source_provenance.outputs.artifact_id }}
          PUBLISHER_JOB_ID: ${{ needs.source_provenance.outputs.publisher_job_id }}
        run: |
          set -euo pipefail
          test -n "${BEPLY_CI_TOKEN}" || { echo "::error::BEPLY_DEV_CI_TOKEN is required"; exit 1; }
          ZIP="/tmp/${PLUGIN_NAME}-v${PLUGIN_VERSION}.zip"
          test "${{ steps.attestation.outputs.artifact_checksum }}" = "${CHECKSUM}" || { echo "::error::DEV attestation checksum drift"; exit 1; }
          # The catalog row is read back against the bytes actually sent.
          SHA256_HEX="$(sha256sum "${ZIP}" | awk '{print $1}')"
          ZIP_BYTES="$(stat -c %s "${ZIP}")"
          test "sha256:${SHA256_HEX}" = "${CHECKSUM}" || { echo "::error::DEV upload bytes differ from the measured release asset"; exit 1; }
          test "${ZIP_BYTES}" = "${FILE_SIZE}" || { echo "::error::DEV upload size differs from the measured release asset"; exit 1; }
          CURL_FIELDS=(
            -F "file=@${ZIP}"
            -F "sourceRepoFullName=${GITHUB_REPOSITORY}"
            -F "sourceReleaseTag=${GITHUB_REF_NAME}"
            -F "sourceReleaseUrl=https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
            -F "sourcePublishedAt=${SOURCE_PUBLISHED_AT}"
          )
          if [ "${SUBMIT_SOURCE_PROVENANCE}" = "true" ]; then
            # Locator of the carrier uploaded by the completed `source_provenance`
            # job. With a locator the platform binds sourceBranch to the tag ref,
            # so the track is sent explicitly.
            [[ "${MANIFEST_ARTIFACT_ID}" =~ ^[1-9][0-9]{0,15}$ ]] || { echo "::error::carrier artifact id is missing"; exit 1; }
            [[ "${PUBLISHER_JOB_ID}" =~ ^[1-9][0-9]{0,15}$ ]] || { echo "::error::publisher job id is missing"; exit 1; }
            SOURCE_PROVENANCE_LOCATOR="$(jq -cn \
              --argjson runId "${GITHUB_RUN_ID}" \
              --argjson runAttempt "${GITHUB_RUN_ATTEMPT}" \
              --argjson publisherJobId "${PUBLISHER_JOB_ID}" \
              --argjson manifestArtifactId "${MANIFEST_ARTIFACT_ID}" \
              '{runId:$runId,runAttempt:$runAttempt,publisherJobId:$publisherJobId,manifestArtifactId:$manifestArtifactId}')"
            CURL_FIELDS+=(
              -F "sourceBranch=${GITHUB_REF_NAME}"
              -F "releaseTrack=${RELEASE_TRACK}"
              --form-string "sourceProvenance=${SOURCE_PROVENANCE_LOCATOR}"
              -F "sourceProvenanceEnvironment=${SOURCE_PROVENANCE_ENVIRONMENT}"
            )
          else
            CURL_FIELDS+=(-F "sourceBranch=${RELEASE_TRACK}")
          fi
          if [ "${HAS_ATTESTATION}" = "true" ]; then
            CURL_FIELDS+=(
              -F "artifactSignature=${{ steps.attestation.outputs.artifact_signature }}"
              -F "artifactSignatureKeyId=${{ steps.attestation.outputs.artifact_signature_key_id }}"
              -F "sbomUrl=${{ steps.attestation.outputs.sbom_url }}"
              -F "sbomChecksum=${{ steps.attestation.outputs.sbom_checksum }}"
              -F "artifactPolicyVersion=${{ steps.attestation.outputs.artifact_policy_version }}"
            )
          fi
          RESPONSE="$(curl -sS -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer ${BEPLY_CI_TOKEN}" \
            "${CURL_FIELDS[@]}" \
            "${BEPLY_API_URL}/api/v1/plugins/release")"
          HTTP_CODE="$(tail -1 <<<"${RESPONSE}")"
          BODY="$(sed '$d' <<<"${RESPONSE}")"
          test "${HTTP_CODE}" -ge 200 && test "${HTTP_CODE}" -lt 300 || { echo "::error::DEV upload failed with HTTP ${HTTP_CODE}"; exit 1; }
          test "$(jq -r '.data.version // empty' <<<"${BODY}")" = "${PLUGIN_VERSION}" || { echo "::error::DEV version mismatch"; exit 1; }
          test "$(jq -r '.data.releaseStatus // empty' <<<"${BODY}")" = "pending_review" || { echo "::error::DEV candidate is not pending_review"; exit 1; }
          CANDIDATE_KIND="$(jq -r '.data.kind // empty' <<<"${BODY}")"
          PLUGIN_ID="$(jq -r '.data.pluginId // empty' <<<"${BODY}")"
          VERSION_ID="$(jq -r '.data.versionId // empty' <<<"${BODY}")"
          SUBMISSION_ID="$(jq -r '.data.submissionId // empty' <<<"${BODY}")"
          case "${CANDIDATE_KIND}" in
            plugin_version)
              test -n "${PLUGIN_ID}" && test -n "${VERSION_ID}" || { echo "::error::DEV version candidate identity missing"; exit 1; }
              # Sink readback: the POST response is the emitter describing
              # itself. Green only when the DEV catalog holds EXACTLY ONE
              # pending row for these bytes and this upload's identity.
              PENDING_JSON="$(curl -sSf \
                -H "Authorization: Bearer ${BEPLY_CI_TOKEN}" \
                "${BEPLY_API_URL}/api/v1/plugins/pending-releases")"
              MATCHES="$(jq \
                --arg repo "${GITHUB_REPOSITORY}" \
                --arg tag "${GITHUB_REF_NAME}" \
                --arg slug "${PLUGIN_NAME}" \
                --arg version "${PLUGIN_VERSION}" \
                --arg checksum "sha256:${SHA256_HEX}" \
                --arg size "${ZIP_BYTES}" \
                --arg pluginId "${PLUGIN_ID}" \
                --arg versionId "${VERSION_ID}" \
                '[.data.releases[]? | select((((.sourceRepoFullName // "") | ascii_downcase) == ($repo | ascii_downcase)) and ((.sourceReleaseTag // "") == $tag) and (((.pluginSlug // "") | ascii_downcase) == ($slug | ascii_downcase)) and ((.version // "") == $version) and ((.checksum // "") == $checksum) and (((.fileSize // -1) | tostring) == $size) and ((.pluginId // "") == $pluginId) and ((.versionId // "") == $versionId))] | length' \
                <<<"${PENDING_JSON}")"
              test "${MATCHES}" = "1" || { echo "::error::DEV readback expected exactly 1 pending row for ${GITHUB_REPOSITORY}@${GITHUB_REF_NAME} ${PLUGIN_NAME} ${PLUGIN_VERSION} sha256:${SHA256_HEX} (${ZIP_BYTES} bytes) versionId ${VERSION_ID}; found ${MATCHES}. If an admin approved it mid-run, verify the catalog; otherwise the row is missing."; exit 1; }
              EVIDENCE="$(jq -cn \
                --arg schemaVersion 'beply.plugin.candidate.v1' \
                --arg candidateKind 'version' \
                --arg pluginName "${PLUGIN_NAME}" \
                --arg version "${PLUGIN_VERSION}" \
                --arg pluginId "${PLUGIN_ID}" \
                --arg versionId "${VERSION_ID}" \
                --arg checksum "${CHECKSUM}" \
                --argjson fileSize "${FILE_SIZE}" \
                --arg releaseTag "${GITHUB_REF_NAME}" \
                --arg sourceSha "${GITHUB_SHA}" \
                '{schemaVersion:$schemaVersion,candidateKind:$candidateKind,pluginName:$pluginName,version:$version,pluginId:$pluginId,versionId:$versionId,checksum:$checksum,fileSize:$fileSize,releaseTag:$releaseTag,sourceSha:$sourceSha}')"
              ;;
            plugin_submission)
              # A submission is not a catalog row: there is nothing pending to
              # read back, so this candidate cannot go green. DEV100 needs a
              # versionId anyway; the plugin must exist in the DEV catalog first.
              echo "::error::DEV created plugin submission ${SUBMISSION_ID} instead of a catalog version; a submission has no pending catalog row to read back, so the candidate fails closed"
              exit 1
              ;;
            *)
              echo "::error::DEV candidate kind is missing or unsupported"
              exit 1
              ;;
          esac
          {
            echo "plugin_id=${PLUGIN_ID}"
            echo "version_id=${VERSION_ID}"
            echo "candidate_kind=${CANDIDATE_KIND}"
            echo "submission_id=${SUBMISSION_ID}"
            echo "candidate_evidence_json=${EVIDENCE}"
          } >> "${GITHUB_OUTPUT}"
          echo "BEPLY_PLUGIN_CANDIDATE_EVIDENCE_JSON=${EVIDENCE}" | tee -a "${GITHUB_STEP_SUMMARY}"
