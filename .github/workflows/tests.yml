name: Tests

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TZ: Europe/Madrid
  FS_E2E_TIMEZONE: Europe/Madrid
  FACTURASCRIPTS_REF: v2026.3
  PLUGIN_FOLDER: ${{ github.event.repository.name }}

concurrency:
  group: plugin-tests-${{ github.event.repository.name }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality_contract:
    name: Quality Contract
    timeout-minutes: 10
    runs-on: ${{ vars.BEPLY_GHA_RUNNER || 'arc-runner-set' }}

    steps:
      - name: Checkout Plugin
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'

      - name: Validate template contract
        run: node scripts/ci/validate-template-contract.mjs

      - name: Validate release workflow model
        run: node scripts/ci/validate-release-model.mjs

      - name: Validate documentation impact
        run: node scripts/ci/validate-docs-impact.mjs

  php84_compat:
    name: PHP 8.4 Compatibility
    needs: quality_contract
    timeout-minutes: 10
    runs-on: ${{ vars.BEPLY_GHA_RUNNER || 'arc-runner-set' }}

    steps:
      - name: Checkout Plugin
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # 2.37.0
        with:
          php-version: '8.4'
          coverage: none

      - name: Run PHP 8.4 compatibility scan
        run: php scripts/ci/php84-compat-scan.php "$PWD"

  lint:
    name: Lint FS ${{ matrix.facturascripts-ref }}
    needs: quality_contract
    timeout-minutes: 10
    runs-on: ${{ vars.BEPLY_GHA_RUNNER || 'arc-runner-set' }}
    strategy:
      fail-fast: false
      matrix:
        facturascripts-ref: ['v2026.3', 'v2026.2']

    steps:
      - name: Checkout FacturaScripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: NeoRazorX/facturascripts
          ref: ${{ matrix.facturascripts-ref }}
          path: facturascripts

      - name: Checkout Plugin
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: facturascripts/Plugins/${{ env.PLUGIN_FOLDER }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # 2.37.0
        with:
          php-version: '8.4'
          coverage: none

      - name: Lint PHP sources
        working-directory: facturascripts
        run: |
          mapfile -d '' -t files < <(
            find "Plugins/${PLUGIN_FOLDER}" \
              -type f -name '*.php' \
              ! -path "*/vendor/*" \
              ! -path "*/node_modules/*" \
              -print0 | sort -z
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP files found to lint."
            exit 0
          fi

          printf '%s\0' "${files[@]}" | xargs -0 -n1 -P4 php -l

  unit:
    name: Unit FS ${{ matrix.facturascripts-ref }} PHP ${{ matrix.php-version }}
    needs: lint
    timeout-minutes: 20
    runs-on: ${{ vars.BEPLY_GHA_RUNNER || 'arc-runner-set' }}
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4']
        facturascripts-ref: ['v2026.3', 'v2026.2']

    steps:
      - name: Checkout FacturaScripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: NeoRazorX/facturascripts
          ref: ${{ matrix.facturascripts-ref }}
          path: facturascripts

      - name: Checkout Plugin
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: facturascripts/Plugins/${{ env.PLUGIN_FOLDER }}
          fetch-depth: 0

      - name: Setup PHP with PCOV
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # 2.37.0
        with:
          php-version: ${{ matrix.php-version }}
          extensions: bcmath, gd, mbstring, intl, zip, curl, pgsql, pdo_pgsql
          coverage: pcov

      - name: Install Composer dependencies
        working-directory: facturascripts
        run: |
          composer config platform.php 8.4.0
          composer install --no-interaction --prefer-dist

      - name: Prepare config.php
        working-directory: facturascripts
        run: |
          cat > config.php << 'EOF'
          <?php
          define('FS_COOKIES_EXPIRE', 31536000);
          define('FS_ROUTE', '');
          define('FS_DB_TYPE', 'postgresql');
          define('FS_DB_HOST', '127.0.0.1');
          define('FS_DB_PORT', 5432);
          define('FS_DB_NAME', 'facturascripts');
          define('FS_DB_USER', 'postgres');
          define('FS_DB_PASS', 'mypassword');
          define('FS_DB_FOREIGN_KEYS', true);
          define('FS_DB_TYPE_CHECK', true);
          define('FS_PGSQL_SSL', false);
          define('FS_PGSQL_ENDPOINT', false);
          define('FS_LANG', 'es_ES');
          define('FS_TIMEZONE', 'Europe/Madrid');
          define('FS_HIDDEN_PLUGINS', '');
          define('FS_DEBUG', false);
          define('FS_DISABLE_ADD_PLUGINS', false);
          define('FS_DISABLE_RM_PLUGINS', false);
          EOF

      - name: Discover unit targets
        id: unit-targets
        working-directory: facturascripts
        run: |
          if [ ! -f "Plugins/${PLUGIN_FOLDER}/phpunit.unit.xml.dist" ]; then
            echo "::error::Missing phpunit.unit.xml.dist"
            exit 1
          fi

          if ! {
            find "Plugins/${PLUGIN_FOLDER}/tests" -type f -name '*Test.php' ! -path "Plugins/${PLUGIN_FOLDER}/tests/runtime/*" 2>/dev/null
            find "Plugins/${PLUGIN_FOLDER}/Test" -maxdepth 1 -type f -name '*Test.php' 2>/dev/null
          } | grep -q .; then
            echo "::error::Missing unit tests"
            exit 1
          fi

          {
            echo "has_tests=true"
            echo "config=Plugins/${PLUGIN_FOLDER}/phpunit.unit.xml.dist"
          } >> "$GITHUB_OUTPUT"

      - name: Run PHPUnit unit suite
        if: steps.unit-targets.outputs.has_tests == 'true' && matrix.php-version == '8.4'
        working-directory: facturascripts
        run: |
          php -d memory_limit=512M vendor/bin/phpunit \
            -c ${{ steps.unit-targets.outputs.config }} \
            --testdox \
            --log-junit=unit-junit.xml \
            --coverage-clover=coverage.xml \
            --coverage-text

      - name: Upload coverage to Codecov
        if: steps.unit-targets.outputs.has_tests == 'true'
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          files: facturascripts/coverage.xml
          flags: unittests
          name: ${{ env.PLUGIN_FOLDER }}-coverage
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  runtime:
    name: Runtime FS ${{ matrix.facturascripts-ref }} PHP ${{ matrix.php-version }}
    needs: lint
    timeout-minutes: 20
    runs-on: ${{ vars.BEPLY_GHA_RUNNER || 'arc-runner-set' }}
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4']
        facturascripts-ref: ['v2026.3', 'v2026.2']

    steps:
      - name: Checkout FacturaScripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: NeoRazorX/facturascripts
          ref: ${{ matrix.facturascripts-ref }}
          path: facturascripts

      - name: Checkout Plugin
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: facturascripts/Plugins/${{ env.PLUGIN_FOLDER }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # 2.37.0
        with:
          php-version: ${{ matrix.php-version }}
          extensions: bcmath, gd, mbstring, intl, zip, curl, pgsql, pdo_pgsql
          coverage: none

      - name: Discover runtime targets
        id: runtime-targets
        working-directory: facturascripts
        run: |
          if [ ! -f "Plugins/${PLUGIN_FOLDER}/phpunit.runtime.xml.dist" ]; then
            echo "::error::Missing phpunit.runtime.xml.dist"
            exit 1
          fi

          if find "Plugins/${PLUGIN_FOLDER}/tests/runtime" "Plugins/${PLUGIN_FOLDER}/Test/main" -type f -name '*Test.php' 2>/dev/null | grep -q .; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
            echo "config=Plugins/${PLUGIN_FOLDER}/phpunit.runtime.xml.dist" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Missing runtime tests"
            exit 1
          fi

      - name: Install Composer dependencies
        if: steps.runtime-targets.outputs.has_tests == 'true'
        working-directory: facturascripts
        run: |
          composer config platform.php 8.4.0
          composer install --no-interaction --prefer-dist

      - name: Start local PostgreSQL
        if: steps.runtime-targets.outputs.has_tests == 'true'
        working-directory: facturascripts
        run: bash Plugins/${PLUGIN_FOLDER}/.github/ci/start-local-postgres.sh

      - name: Prepare config.php
        if: steps.runtime-targets.outputs.has_tests == 'true'
        working-directory: facturascripts
        run: |
          cat > config.php << 'EOF'
          <?php
          define('FS_COOKIES_EXPIRE', 31536000);
          define('FS_ROUTE', '');
          define('FS_DB_TYPE', 'postgresql');
          define('FS_DB_HOST', '127.0.0.1');
          define('FS_DB_PORT', 5432);
          define('FS_DB_NAME', 'facturascripts');
          define('FS_DB_USER', 'postgres');
          define('FS_DB_PASS', 'mypassword');
          define('FS_DB_FOREIGN_KEYS', true);
          define('FS_DB_TYPE_CHECK', true);
          define('FS_PGSQL_SSL', false);
          define('FS_PGSQL_ENDPOINT', false);
          define('FS_LANG', 'es_ES');
          define('FS_TIMEZONE', 'Europe/Madrid');
          define('FS_HIDDEN_PLUGINS', '');
          define('FS_DEBUG', false);
          define('FS_DISABLE_ADD_PLUGINS', false);
          define('FS_DISABLE_RM_PLUGINS', false);
          EOF

      - name: Prepare plugin runtime
        if: steps.runtime-targets.outputs.has_tests == 'true'
        working-directory: facturascripts
        env:
          CI_PLUGIN_FOLDERS: ${{ env.PLUGIN_FOLDER }}
        run: php Plugins/${PLUGIN_FOLDER}/.github/ci/setup-runtime.php

      - name: Run PHPUnit runtime suite
        if: steps.runtime-targets.outputs.has_tests == 'true'
        working-directory: facturascripts
        run: |
          php -d memory_limit=768M vendor/bin/phpunit \
            -c ${{ steps.runtime-targets.outputs.config }} \
            --testdox \
            --log-junit=runtime-junit.xml

      - name: Stop local PostgreSQL
        if: always()
        working-directory: facturascripts
        run: |
          if [ -n "${PGDATA_DIR:-}" ] && [ -f "${PGDATA_DIR}/postmaster.pid" ]; then
            if [ "${PG_RUN_AS_POSTGRES:-0}" = "1" ]; then
              runuser -u postgres -- env PATH="${PATH}" pg_ctl -D "${PGDATA_DIR}" -m fast stop
            else
              pg_ctl -D "${PGDATA_DIR}" -m fast stop
            fi
          fi

  e2e:
    name: E2E FS ${{ matrix.facturascripts-ref }}
    needs: lint
    timeout-minutes: 25
    runs-on: ${{ vars.BEPLY_GHA_RUNNER || 'arc-runner-set' }}
    strategy:
      fail-fast: false
      matrix:
        facturascripts-ref: ['v2026.3', 'v2026.2']
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

    steps:
      - name: Checkout FacturaScripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: NeoRazorX/facturascripts
          ref: ${{ matrix.facturascripts-ref }}
          path: facturascripts

      - name: Checkout Plugin
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: facturascripts/Plugins/${{ env.PLUGIN_FOLDER }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # 2.37.0
        with:
          php-version: '8.4'
          extensions: bcmath, gd, mbstring, intl, zip, curl, pgsql, pdo_pgsql
          coverage: none

      - name: Discover e2e targets
        id: e2e-targets
        working-directory: facturascripts
        run: |
          TESTS_DIR="Plugins/${PLUGIN_FOLDER}/tests"
          if [ -f "${TESTS_DIR}/package.json" ] && find "${TESTS_DIR}/e2e" -type f -name '*.spec.ts' 2>/dev/null | grep -q .; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
            echo "tests_dir=${TESTS_DIR}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Missing E2E Playwright tests"
            exit 1
          fi

      - name: Setup Node.js
        if: steps.e2e-targets.outputs.has_tests == 'true'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'

      - name: Install Composer dependencies
        if: steps.e2e-targets.outputs.has_tests == 'true'
        working-directory: facturascripts
        run: |
          composer config platform.php 8.4.0
          composer install --no-interaction --prefer-dist

      - name: Install core frontend dependencies
        if: steps.e2e-targets.outputs.has_tests == 'true'
        working-directory: facturascripts
        run: npm install --no-fund --no-audit

      - name: Start local PostgreSQL
        if: steps.e2e-targets.outputs.has_tests == 'true'
        working-directory: facturascripts
        run: bash Plugins/${PLUGIN_FOLDER}/.github/ci/start-local-postgres.sh

      - name: Prepare config.php
        if: steps.e2e-targets.outputs.has_tests == 'true'
        working-directory: facturascripts
        run: |
          cat > config.php << 'EOF'
          <?php
          define('FS_COOKIES_EXPIRE', 31536000);
          define('FS_ROUTE', '');
          define('FS_DB_TYPE', 'postgresql');
          define('FS_DB_HOST', '127.0.0.1');
          define('FS_DB_PORT', 5432);
          define('FS_DB_NAME', 'facturascripts');
          define('FS_DB_USER', 'postgres');
          define('FS_DB_PASS', 'mypassword');
          define('FS_DB_FOREIGN_KEYS', true);
          define('FS_DB_TYPE_CHECK', true);
          define('FS_PGSQL_SSL', false);
          define('FS_PGSQL_ENDPOINT', false);
          define('FS_LANG', 'es_ES');
          define('FS_TIMEZONE', 'Europe/Madrid');
          define('FS_HIDDEN_PLUGINS', '');
          define('FS_DEBUG', false);
          define('FS_DISABLE_ADD_PLUGINS', false);
          define('FS_DISABLE_RM_PLUGINS', false);
          EOF

      - name: Prepare plugin runtime
        if: steps.e2e-targets.outputs.has_tests == 'true'
        working-directory: facturascripts
        env:
          CI_PLUGIN_FOLDERS: ${{ env.PLUGIN_FOLDER }}
        run: php Plugins/${PLUGIN_FOLDER}/.github/ci/setup-runtime.php

      - name: Install Playwright dependencies
        if: steps.e2e-targets.outputs.has_tests == 'true'
        working-directory: facturascripts/${{ steps.e2e-targets.outputs.tests_dir }}
        run: |
          npm ci
          npx playwright install chromium

      - name: Start PHP server
        if: steps.e2e-targets.outputs.has_tests == 'true'
        working-directory: facturascripts
        run: |
          php -S 127.0.0.1:8765 index.php > "${RUNNER_TEMP}/${PLUGIN_FOLDER}-php-server.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/${PLUGIN_FOLDER}-php-server.pid"

      - name: Wait for application
        if: steps.e2e-targets.outputs.has_tests == 'true'
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::FacturaScripts server did not start in time."
          exit 1

      - name: Run Playwright suite
        if: steps.e2e-targets.outputs.has_tests == 'true'
        working-directory: facturascripts/${{ steps.e2e-targets.outputs.tests_dir }}
        env:
          BASE_URL: http://127.0.0.1:8765
        run: npx playwright test

      - name: Upload Playwright artifacts
        if: failure() && steps.e2e-targets.outputs.has_tests == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: ${{ env.PLUGIN_FOLDER }}-e2e-artifacts
          path: |
            facturascripts/${{ steps.e2e-targets.outputs.tests_dir }}/playwright-report
            facturascripts/${{ steps.e2e-targets.outputs.tests_dir }}/test-results
            ${{ runner.temp }}/${{ env.PLUGIN_FOLDER }}-php-server.log

      - name: Stop PHP server
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/${PLUGIN_FOLDER}-php-server.pid" ]; then
            kill "$(cat "${RUNNER_TEMP}/${PLUGIN_FOLDER}-php-server.pid")" 2>/dev/null || true
          fi

      - name: Stop local PostgreSQL
        if: always()
        working-directory: facturascripts
        run: |
          if [ -n "${PGDATA_DIR:-}" ] && [ -f "${PGDATA_DIR}/postmaster.pid" ]; then
            if [ "${PG_RUN_AS_POSTGRES:-0}" = "1" ]; then
              runuser -u postgres -- env PATH="${PATH}" pg_ctl -D "${PGDATA_DIR}" -m fast stop
            else
              pg_ctl -D "${PGDATA_DIR}" -m fast stop
            fi
          fi
