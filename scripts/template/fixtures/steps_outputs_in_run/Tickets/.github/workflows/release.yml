name: Release Plugin

on:
  push:
    branches:
      - '**'
    tags: ['v*']
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'docs/**'
      - 'Test/**'
      - 'Tests/**'
      - 'tests/**'
      - 'coverage-html/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: tickets-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  verify_tests:
    name: Verify Tests Workflow
    timeout-minutes: 20
    runs-on: ${{ vars.BEPLY_GHA_RUNNER == 'arc-runner-prio' && 'arc-runner-prio' || 'arc-runner-set' }}

    steps:
      - name: Wait for Tests workflow on this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          TARGET_REF_NAME: ${{ github.ref_name }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.request

          repository = os.environ["REPOSITORY"]
          target_sha = os.environ["TARGET_SHA"]
          target_ref_name = os.environ["TARGET_REF_NAME"]
          current_run_id = int(os.environ["CURRENT_RUN_ID"])
          token = os.environ["GITHUB_TOKEN"]
          api_url = f"https://api.github.com/repos/{repository}/actions/runs?head_sha={target_sha}&per_page=100"
          deadline = time.time() + 19 * 60

          def fetch_runs():
              request = urllib.request.Request(
                  api_url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "tickets-release-gate",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          while time.time() < deadline:
              payload = fetch_runs()
              runs = [
                  run for run in payload.get("workflow_runs", [])
                  if run.get("name") == "Tests"
                  and int(run.get("id", 0)) != current_run_id
                  and run.get("head_branch") == target_ref_name
              ]

              if not runs:
                  print("Waiting for Tests workflow to start on this commit...")
                  time.sleep(15)
                  continue

              run = runs[0]
              status = run.get("status")
              conclusion = run.get("conclusion")
              html_url = run.get("html_url", "")
              print(f"Tests workflow status={status} conclusion={conclusion} url={html_url}")

              if status != "completed":
                  time.sleep(15)
                  continue

              if conclusion == "success":
                  sys.exit(0)

              print(f"Tests workflow did not succeed: {conclusion}", file=sys.stderr)
              sys.exit(1)

          print("Timed out waiting for Tests workflow to complete successfully.", file=sys.stderr)
          sys.exit(1)
          PY

  upload_dev:
    name: Upload Dev Candidate
    needs: verify_tests
    if: github.ref_type == 'branch' && github.ref_name == (vars.BEPLY_RELEASE_BRANCH || github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 15
    runs-on: ${{ vars.BEPLY_GHA_RUNNER == 'arc-runner-prio' && 'arc-runner-prio' || 'arc-runner-set' }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # 2.37.0
        with:
          php-version: "8.4"

      - name: Parse facturascripts.ini
        id: ini
        run: |
          parse_field() {
            local key="$1"
            local value
            value=$(grep -E "^${key}\\s*=" facturascripts.ini | head -1 | sed 's/^[^=]*=[ ]*//' | sed 's/^\"\\(.*\\)\"$/\\1/' | tr -d '\r' | xargs)
            echo "$value"
          }

          {
            echo "version=$(parse_field version)"
            echo "name=$(parse_field name)"
          } >> "$GITHUB_OUTPUT"

      - name: Build plugin zip
        id: build_zip
        env:
          PLUGIN_NAME: ${{ steps.ini.outputs.name }}
          PLUGIN_VERSION: ${{ steps.ini.outputs.version }}
        run: |
          set -euo pipefail
          zip_path="${RUNNER_TEMP}/${PLUGIN_NAME}-dev-${PLUGIN_VERSION}.zip"
          scripts/build-release-zip.sh "${zip_path}"
          php scripts/validate-release-zip.php "${zip_path}"
          echo "zip_path=${zip_path}" >> "${GITHUB_OUTPUT}"

      - name: Generate dev artifact attestation
        id: dev_attestation
        env:
          PLUGIN_NAME: ${{ steps.ini.outputs.name }}
          PLUGIN_VERSION: ${{ steps.ini.outputs.version }}
          PLUGIN_ZIP: ${{ steps.build_zip.outputs.zip_path }}
          PLUGIN_RELEASE_TRACK: main
          PLUGIN_ARTIFACT_PREFIX: plugins/dev
          SOURCE_REPO_FULL_NAME: ${{ github.repository }}
          SOURCE_RELEASE_TAG: ${{ github.ref_name }}-${{ github.sha }}
          SOURCE_RELEASE_URL: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          PLUGIN_ARTIFACT_SIGNING_PRIVATE_KEY: ${{ secrets.BEPLY_DEV_PLUGIN_ARTIFACT_SIGNING_PRIVATE_KEY }}
          PLUGIN_ARTIFACT_SIGNATURE_KEY_ID: ${{ secrets.BEPLY_DEV_PLUGIN_ARTIFACT_SIGNATURE_KEY_ID }}
        run: node scripts/ci/build-plugin-artifact-attestation.mjs

      - name: Require canonical DEV artifact ingestion when the repo signer is unavailable
        if: steps.dev_attestation.outputs.has_attestation != 'true'
        run: |
          echo "::notice::Canonical DEV artifact ingestion required from the exact Tests workflow artifact."

      - name: Upload candidate to Beply dev
        if: steps.dev_attestation.outputs.has_attestation == 'true'
        env:
          BEPLY_API_URL: https://api.services.devbeply.es
          BEPLY_DEV_CI_TOKEN: ${{ secrets.BEPLY_DEV_CI_TOKEN }}
          PLUGIN_NAME: ${{ steps.ini.outputs.name }}
          PLUGIN_VERSION: ${{ steps.ini.outputs.version }}
        run: |
          set -euo pipefail
          ZIP="${{ steps.build_zip.outputs.zip_path }}"
          SOURCE_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          SOURCE_TAG="${GITHUB_REF_NAME}-${GITHUB_SHA::12}"
          PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          if [ -z "$BEPLY_DEV_CI_TOKEN" ]; then
            echo "::warning::BEPLY_DEV_CI_TOKEN not configured. Skipping dev platform upload."
            exit 0
          fi
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${BEPLY_DEV_CI_TOKEN}" \
            -F "file=@${ZIP}" \
            -F "sourceRepoFullName=${{ github.repository }}" \
            -F "sourceReleaseTag=${SOURCE_TAG}" \
            -F "sourceReleaseUrl=${SOURCE_URL}" \
            -F "sourcePublishedAt=${PUBLISHED_AT}" \
            -F "artifactSignature=${{ steps.dev_attestation.outputs.artifact_signature }}" \
            -F "artifactSignatureKeyId=${{ steps.dev_attestation.outputs.artifact_signature_key_id }}" \
            -F "sbomUrl=${{ steps.dev_attestation.outputs.sbom_url }}" \
            -F "sbomChecksum=${{ steps.dev_attestation.outputs.sbom_checksum }}" \
            -F "artifactPolicyVersion=${{ steps.dev_attestation.outputs.artifact_policy_version }}" \
            "${BEPLY_API_URL}/api/v1/plugins/release")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "::notice::Plugin uploaded to Beply dev. Pending admin review."
            echo "$BODY" | jq -r '.data | "Plugin: \(.pluginName) | Version: \(.version) | Status: \(.releaseStatus)"' 2>/dev/null || echo "$BODY"
            exit 0
          fi

          if [ "$HTTP_CODE" = "409" ] && echo "$BODY" | grep -q 'VERSION_ALREADY_APPROVED'; then
            echo "::notice::Version already approved in dev. No new candidate uploaded."
            echo "$BODY"
            exit 0
          fi
          if [ "$HTTP_CODE" = "409" ] && echo "$BODY" | grep -q 'SUBMISSION_PENDING'; then
            echo "::notice::Version already awaits review in dev."
            echo "$BODY"
            exit 0
          fi

          echo "::error::Dev platform upload failed (HTTP $HTTP_CODE): $BODY"
          exit 1

  release_prod:
    name: Release Prod Candidate
    needs: verify_tests
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 15
    runs-on: ${{ vars.BEPLY_GHA_RUNNER == 'arc-runner-prio' && 'arc-runner-prio' || 'arc-runner-set' }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # 2.37.0
        with:
          php-version: "8.4"

      - name: Parse facturascripts.ini
        id: ini
        run: |
          parse_field() {
            local key="$1"
            local value
            value=$(grep -E "^${key}\\s*=" facturascripts.ini | head -1 | sed 's/^[^=]*=[ ]*//' | sed 's/^\"\\(.*\\)\"$/\\1/' | tr -d '\r' | xargs)
            echo "$value"
          }

          {
            echo "version=$(parse_field version)"
            echo "name=$(parse_field name)"
            echo "min_version=$(parse_field min_version)"
            echo "max_version=$(parse_field max_version)"
            echo "min_php=$(parse_field min_php)"
            echo "description=$(parse_field description)"
          } >> "$GITHUB_OUTPUT"

      - name: Validate tag matches plugin version
        run: |
          set -e
          EXPECTED_TAG="v${{ steps.ini.outputs.version }}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match facturascripts.ini version ${EXPECTED_TAG}"
            exit 1
          fi

      - name: Generate release notes
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log "${PREV_TAG}..${GITHUB_REF_NAME}" --pretty=format:"- %s (%h)" --no-merges)
          else
            NOTES=$(git log "${GITHUB_REF_NAME}" --pretty=format:"- %s (%h)" --no-merges -20)
          fi

          if [ -z "$NOTES" ]; then
            NOTES="- Release inicial"
          fi

          {
            echo "notes<<CHANGELOG_EOF"
            echo "$NOTES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build plugin zip
        id: build_zip
        env:
          PLUGIN_NAME: ${{ steps.ini.outputs.name }}
          PLUGIN_VERSION: ${{ steps.ini.outputs.version }}
        run: |
          set -euo pipefail
          zip_path="${RUNNER_TEMP}/${PLUGIN_NAME}-v${PLUGIN_VERSION}.zip"
          scripts/build-release-zip.sh "${zip_path}"
          php scripts/validate-release-zip.php "${zip_path}"
          echo "zip_path=${zip_path}" >> "${GITHUB_OUTPUT}"

      - name: Generate prod artifact attestation
        id: prod_attestation
        env:
          PLUGIN_NAME: ${{ steps.ini.outputs.name }}
          PLUGIN_VERSION: ${{ steps.ini.outputs.version }}
          PLUGIN_ZIP: ${{ steps.build_zip.outputs.zip_path }}
          PLUGIN_RELEASE_TRACK: main
          PLUGIN_ARTIFACT_PREFIX: plugins/prod
          SOURCE_REPO_FULL_NAME: ${{ github.repository }}
          SOURCE_RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          PLUGIN_ARTIFACT_SIGNING_PRIVATE_KEY: ${{ secrets.BEPLY_PLUGIN_ARTIFACT_SIGNING_PRIVATE_KEY }}
          PLUGIN_ARTIFACT_SIGNATURE_KEY_ID: ${{ secrets.BEPLY_PLUGIN_ARTIFACT_SIGNATURE_KEY_ID }}
        run: node scripts/ci/build-plugin-artifact-attestation.mjs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          tag_name: "${{ github.ref_name }}"
          name: "${{ steps.ini.outputs.name }} ${{ github.ref_name }}"
          body: |
            ## ${{ steps.ini.outputs.name }} ${{ github.ref_name }}

            | Campo | Valor |
            |-------|-------|
            | **Version** | `${{ steps.ini.outputs.version }}` |
            | **Version minima FS** | `${{ steps.ini.outputs.min_version }}` |
            | **Version maxima FS** | `${{ steps.ini.outputs.max_version || 'Sin limite' }}` |
            | **PHP minimo** | `${{ steps.ini.outputs.min_php }}` |

            ### Descripcion
            ${{ steps.ini.outputs.description }}

            ### Notas de version
            ${{ steps.changelog.outputs.notes }}
          files: |
            ${{ steps.build_zip.outputs.zip_path }}
            ${{ steps.prod_attestation.outputs.sbom_path }}

      - name: Upload to Beply Platform
        env:
          BEPLY_API_URL: ${{ secrets.BEPLY_API_URL }}
          BEPLY_CI_TOKEN: ${{ secrets.BEPLY_CI_TOKEN }}
          PLUGIN_NAME: ${{ steps.ini.outputs.name }}
          PLUGIN_VERSION: ${{ steps.ini.outputs.version }}
        run: |
          set -euo pipefail
          ZIP="${{ steps.build_zip.outputs.zip_path }}"

          if [ -z "$BEPLY_API_URL" ] || [ -z "$BEPLY_CI_TOKEN" ]; then
            echo "::warning::BEPLY_API_URL or BEPLY_CI_TOKEN not configured. Skipping platform upload."
            exit 0
          fi
          if [ "${{ steps.prod_attestation.outputs.has_attestation }}" != "true" ]; then
            echo "::error::Prod signing secrets are required when BEPLY_CI_TOKEN is configured."
            exit 1
          fi

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${BEPLY_CI_TOKEN}" \
            -F "file=@${ZIP}" \
            -F "sourceRepoFullName=${{ github.repository }}" \
            -F "sourceReleaseTag=${GITHUB_REF_NAME}" \
            -F "sourceReleaseUrl=https://github.com/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}" \
            -F "sourcePublishedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -F "artifactSignature=${{ steps.prod_attestation.outputs.artifact_signature }}" \
            -F "artifactSignatureKeyId=${{ steps.prod_attestation.outputs.artifact_signature_key_id }}" \
            -F "sbomUrl=${{ steps.prod_attestation.outputs.sbom_url }}" \
            -F "sbomChecksum=${{ steps.prod_attestation.outputs.sbom_checksum }}" \
            -F "artifactPolicyVersion=${{ steps.prod_attestation.outputs.artifact_policy_version }}" \
            "${BEPLY_API_URL}/api/v1/plugins/release")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "::notice::Plugin uploaded to Beply Platform. Pending admin review."
            echo "$BODY" | jq -r '.data | "Plugin: \(.pluginName) | Version: \(.version) | Status: \(.releaseStatus)"' 2>/dev/null || echo "$BODY"
            exit 0
          fi

          if [ "$HTTP_CODE" = "409" ] && echo "$BODY" | grep -q 'VERSION_ALREADY_APPROVED'; then
            echo "::notice::Version already approved in prod."
            echo "$BODY"
            exit 0
          fi
          if [ "$HTTP_CODE" = "409" ] && echo "$BODY" | grep -q 'SUBMISSION_PENDING'; then
            echo "::notice::Version already awaits review in prod."
            echo "$BODY"
            exit 0
          fi

          echo "::error::Platform upload failed (HTTP $HTTP_CODE): $BODY"
          exit 1
