name: Tests

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONDONTWRITEBYTECODE: "1"
  TZ: Europe/Madrid
  FS_E2E_TIMEZONE: Europe/Madrid
  FACTURASCRIPTS_REF: v2025.71
  PLUGIN_FOLDER: ${{ github.event.repository.name }}

concurrency:
  group: plugin-tests-${{ github.event.repository.name }}-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}-{2}', github.event_name, github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  php84_compat:
    name: PHP 8.4 Compatibility
    timeout-minutes: 10
    runs-on: ${{ vars.BEPLY_GHA_RUNNER || 'arc-runner-set' }}

    steps:
      - name: Checkout Plugin
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Prepare ARC PHP prerequisites
        run: bash .github/ci/prepare-arc-php.sh

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # 2.37.0
        with:
          php-version: '8.2'
          coverage: none

      - name: Run PHP 8.4 compatibility scan
        run: php scripts/ci/php84-compat-scan.php "$PWD"

      - name: Unit test one Tests run per SHA and draft PR gating
        run: python3 .github/ci/test_tests_workflow_triggers.py

      - name: Exact release provenance contract tests
        run: python3 -m unittest discover -s scripts/ci -p 'test_download_provenance_release_asset.py' -v

      - name: Exact accounting source and workflow contracts
        run: python3 -m unittest discover -s .github/ci -p 'test_accounting_ci_*.py' -v

      - name: Canonical R2 transport contracts without provider effects
        run: python3 -m unittest discover -s scripts/ci -p 'test_upload_ci_evidence.py' -v

  lint:
    timeout-minutes: 10
    if: github.event.pull_request.draft != true
    runs-on: ${{ vars.BEPLY_GHA_RUNNER || 'arc-runner-set' }}

    steps:
      - name: Checkout FacturaScripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: NeoRazorX/facturascripts
          ref: ${{ env.FACTURASCRIPTS_REF }}
          path: facturascripts

      - name: Checkout Plugin
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: facturascripts/Plugins/${{ env.PLUGIN_FOLDER }}
          fetch-depth: 0

      - name: Prepare ARC PHP prerequisites
        run: bash facturascripts/Plugins/${{ env.PLUGIN_FOLDER }}/.github/ci/prepare-arc-php.sh

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # 2.37.0
        with:
          php-version: '8.4'
          coverage: none

      - name: Lint PHP sources
        working-directory: facturascripts
        run: |
          mapfile -d '' -t files < <(
            find "Plugins/${PLUGIN_FOLDER}" \
              -type f -name '*.php' \
              ! -path "*/vendor/*" \
              ! -path "*/node_modules/*" \
              -print0 | sort -z
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP files found to lint."
            exit 0
          fi

          printf '%s\0' "${files[@]}" | xargs -0 -n1 -P4 php -l

  unit:
    needs: lint
    timeout-minutes: 20
    runs-on: ${{ vars.BEPLY_GHA_RUNNER || 'arc-runner-set' }}
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.4']

    steps:
      - name: Checkout FacturaScripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: NeoRazorX/facturascripts
          ref: ${{ env.FACTURASCRIPTS_REF }}
          path: facturascripts

      - name: Checkout Plugin
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: facturascripts/Plugins/${{ env.PLUGIN_FOLDER }}
          fetch-depth: 0

      - name: Resolve immutable accounting source lock
        id: accounting_sources
        working-directory: facturascripts
        run: python3 Plugins/${PLUGIN_FOLDER}/.github/ci/accounting_ci_sources.py outputs --github-output "$GITHUB_OUTPUT"

      - name: Require read-only access to the named private source repositories
        env:
          SOURCE_READ_KEY: ${{ secrets.BEPLY_ACCOUNTING_BASE_READ_DEPLOY_KEY }}
        run: |
          test -n "$SOURCE_READ_KEY" || { echo '::error::Missing scoped read-only accounting source capability'; exit 1; }

      - name: Checkout exact BeplyContabilidadExterna test dependency
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: beply-es/BeplyContabilidadExterna
          ref: ${{ steps.accounting_sources.outputs.base_ref }}
          ssh-key: ${{ secrets.BEPLY_ACCOUNTING_BASE_READ_DEPLOY_KEY }}
          persist-credentials: false
          path: facturascripts/Plugins/BeplyContabilidadExterna

      - name: Comprobar que la clave de lectura no queda en el runner
        if: always()
        run: bash facturascripts/Plugins/${{ env.PLUGIN_FOLDER }}/.github/ci/assert-read-key-gone.sh facturascripts/Plugins/BeplyContabilidadExterna

      - name: Prepare ARC PHP prerequisites
        run: bash facturascripts/Plugins/${{ env.PLUGIN_FOLDER }}/.github/ci/prepare-arc-php.sh

      - name: Setup PHP with PCOV
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # 2.37.0
        with:
          php-version: ${{ matrix.php-version }}
          extensions: bcmath, gd, mbstring, intl, zip, curl, pgsql, pdo_pgsql
          coverage: pcov

      - name: Install Composer dependencies
        working-directory: facturascripts
        env:
          COMPOSER_PROCESS_TIMEOUT: 900
        run: bash Plugins/${PLUGIN_FOLDER}/.github/ci/composer-install.sh "${{ matrix.php-version }}"

      - name: Prepare config.php
        working-directory: facturascripts
        run: |
          cat > config.php << 'EOF'
          <?php
          define('FS_COOKIES_EXPIRE', 31536000);
          define('FS_ROUTE', '');
          define('FS_DB_TYPE', 'postgresql');
          define('FS_DB_HOST', '127.0.0.1');
          define('FS_DB_PORT', (int) getenv('PGPORT') ?: 5432);
          define('FS_DB_NAME', 'facturascripts');
          define('FS_DB_USER', 'postgres');
          define('FS_DB_PASS', 'mypassword');
          define('FS_DB_FOREIGN_KEYS', true);
          define('FS_DB_TYPE_CHECK', true);
          define('FS_PGSQL_SSL', false);
          define('FS_PGSQL_ENDPOINT', false);
          define('FS_LANG', 'es_ES');
          define('FS_TIMEZONE', 'Europe/Madrid');
          define('FS_HIDDEN_PLUGINS', '');
          define('FS_DEBUG', false);
          define('FS_DISABLE_ADD_PLUGINS', false);
          define('FS_DISABLE_RM_PLUGINS', false);
          EOF

      - name: Verify source checkouts and prepare exact unit plugin state
        working-directory: facturascripts
        run: python3 Plugins/${PLUGIN_FOLDER}/.github/ci/accounting_ci_sources.py prepare-unit --workspace "$PWD"

      - name: Discover unit targets
        id: unit-targets
        working-directory: facturascripts
        run: |
          if [ ! -f "Plugins/${PLUGIN_FOLDER}/phpunit.unit.xml.dist" ]; then
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! {
            find "Plugins/${PLUGIN_FOLDER}/tests" -type f -name '*Test.php' ! -path "Plugins/${PLUGIN_FOLDER}/tests/runtime/*" 2>/dev/null
            find "Plugins/${PLUGIN_FOLDER}/Test" -maxdepth 1 -type f -name '*Test.php' 2>/dev/null
          } | grep -q .; then
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "has_tests=true"
            echo "config=Plugins/${PLUGIN_FOLDER}/phpunit.unit.xml.dist"
          } >> "$GITHUB_OUTPUT"

      - name: Run PHPUnit unit suite
        if: steps.unit-targets.outputs.has_tests == 'true'
        working-directory: facturascripts
        run: |
          php -d memory_limit=512M vendor/bin/phpunit \
            -c ${{ steps.unit-targets.outputs.config }} \
            --testdox \
            --log-junit=unit-junit.xml \
            --coverage-clover=coverage.xml \
            --coverage-text

      - name: Upload coverage to Codecov
        if: steps.unit-targets.outputs.has_tests == 'true' && matrix.php-version == '8.4'
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          files: facturascripts/coverage.xml
          flags: unittests
          name: ${{ env.PLUGIN_FOLDER }}-coverage
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  runtime:
    needs: lint
    timeout-minutes: 20
    runs-on: ${{ vars.BEPLY_GHA_RUNNER || 'arc-runner-set' }}
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.4']

    steps:
      - name: Checkout FacturaScripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: NeoRazorX/facturascripts
          ref: ${{ env.FACTURASCRIPTS_REF }}
          path: facturascripts

      - name: Checkout Plugin
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: facturascripts/Plugins/${{ env.PLUGIN_FOLDER }}
          fetch-depth: 0

      - name: Resolve immutable accounting source lock
        id: accounting_sources
        working-directory: facturascripts
        run: python3 Plugins/${PLUGIN_FOLDER}/.github/ci/accounting_ci_sources.py outputs --github-output "$GITHUB_OUTPUT"

      - name: Require read-only access to the named private source repositories
        env:
          SOURCE_READ_KEY: ${{ secrets.BEPLY_ACCOUNTING_BASE_READ_DEPLOY_KEY }}
        run: |
          test -n "$SOURCE_READ_KEY" || { echo '::error::Missing scoped read-only accounting source capability'; exit 1; }

      - name: Checkout exact BeplyContabilidadExterna test dependency
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: beply-es/BeplyContabilidadExterna
          ref: ${{ steps.accounting_sources.outputs.base_ref }}
          ssh-key: ${{ secrets.BEPLY_ACCOUNTING_BASE_READ_DEPLOY_KEY }}
          persist-credentials: false
          path: facturascripts/Plugins/BeplyContabilidadExterna

      - name: Comprobar que la clave de lectura no queda en el runner
        if: always()
        run: bash facturascripts/Plugins/${{ env.PLUGIN_FOLDER }}/.github/ci/assert-read-key-gone.sh facturascripts/Plugins/BeplyContabilidadExterna

      - name: Prepare ARC PHP prerequisites
        run: bash facturascripts/Plugins/${{ env.PLUGIN_FOLDER }}/.github/ci/prepare-arc-php.sh

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # 2.37.0
        with:
          php-version: ${{ matrix.php-version }}
          extensions: bcmath, gd, mbstring, intl, zip, curl, pgsql, pdo_pgsql
          coverage: none

      - name: Discover runtime targets
        id: runtime-targets
        working-directory: facturascripts
        run: |
          if [ ! -f "Plugins/${PLUGIN_FOLDER}/phpunit.runtime.xml.dist" ]; then
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          runtime_test=""
          for runtime_directory in "Plugins/${PLUGIN_FOLDER}/tests/runtime" "Plugins/${PLUGIN_FOLDER}/Test/main"; do
            if [ -d "$runtime_directory" ]; then
              runtime_test="$(find "$runtime_directory" -type f -name '*Test.php' -print -quit)"
              if [ -n "$runtime_test" ]; then
                break
              fi
            fi
          done
          if [ -n "$runtime_test" ]; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
            echo "config=Plugins/${PLUGIN_FOLDER}/phpunit.runtime.xml.dist" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Composer dependencies
        if: steps.runtime-targets.outputs.has_tests == 'true'
        working-directory: facturascripts
        env:
          COMPOSER_PROCESS_TIMEOUT: 900
        run: bash Plugins/${PLUGIN_FOLDER}/.github/ci/composer-install.sh "${{ matrix.php-version }}"

      - name: Start local PostgreSQL
        if: steps.runtime-targets.outputs.has_tests == 'true'
        working-directory: facturascripts
        run: bash Plugins/${PLUGIN_FOLDER}/.github/ci/start-local-postgres.sh

      - name: Prepare config.php
        if: steps.runtime-targets.outputs.has_tests == 'true'
        working-directory: facturascripts
        run: |
          cat > config.php << 'EOF'
          <?php
          define('FS_COOKIES_EXPIRE', 31536000);
          define('FS_ROUTE', '');
          define('FS_DB_TYPE', 'postgresql');
          define('FS_DB_HOST', '127.0.0.1');
          define('FS_DB_PORT', (int) getenv('PGPORT') ?: 5432);
          define('FS_DB_NAME', 'facturascripts');
          define('FS_DB_USER', 'postgres');
          define('FS_DB_PASS', 'mypassword');
          define('FS_DB_FOREIGN_KEYS', true);
          define('FS_DB_TYPE_CHECK', true);
          define('FS_PGSQL_SSL', false);
          define('FS_PGSQL_ENDPOINT', false);
          define('FS_LANG', 'es_ES');
          define('FS_TIMEZONE', 'Europe/Madrid');
          define('FS_HIDDEN_PLUGINS', '');
          define('FS_DEBUG', false);
          define('FS_DISABLE_ADD_PLUGINS', false);
          define('FS_DISABLE_RM_PLUGINS', false);
          EOF

      - name: Prepare plugin runtime
        if: steps.runtime-targets.outputs.has_tests == 'true'
        working-directory: facturascripts
        env:
          CI_PLUGIN_FOLDERS: ${{ steps.accounting_sources.outputs.runtime_plugins }}
        run: php Plugins/${PLUGIN_FOLDER}/.github/ci/setup-runtime.php

      - name: Run PHPUnit runtime suite
        if: steps.runtime-targets.outputs.has_tests == 'true'
        working-directory: facturascripts
        run: |
          php -d memory_limit=768M vendor/bin/phpunit \
            -c ${{ steps.runtime-targets.outputs.config }} \
            --testdox \
            --log-junit=runtime-junit.xml

      - name: Stop local PostgreSQL
        if: always()
        working-directory: facturascripts
        run: |
          if [ -n "${PGDATA_DIR:-}" ] && [ -f "${PGDATA_DIR}/postmaster.pid" ]; then
            if [ "${PG_RUN_AS_POSTGRES:-0}" = "1" ]; then
              runuser -u postgres -- env PATH="${PATH}" pg_ctl -D "${PGDATA_DIR}" -m fast stop
            else
              pg_ctl -D "${PGDATA_DIR}" -m fast stop
            fi
          fi

  e2e:
    needs: lint
    timeout-minutes: 45
    runs-on: ${{ vars.BEPLY_GHA_RUNNER || 'arc-runner-set' }}

    steps:
      - name: Checkout FacturaScripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: NeoRazorX/facturascripts
          ref: ${{ env.FACTURASCRIPTS_REF }}
          path: facturascripts

      - name: Checkout Plugin
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: facturascripts/Plugins/${{ env.PLUGIN_FOLDER }}
          fetch-depth: 0

      - name: Resolve immutable accounting source lock
        id: accounting_sources
        working-directory: facturascripts
        run: python3 Plugins/${PLUGIN_FOLDER}/.github/ci/accounting_ci_sources.py outputs --github-output "$GITHUB_OUTPUT"

      - name: Require read-only access to the named private source repositories
        env:
          SOURCE_READ_KEY: ${{ secrets.BEPLY_ACCOUNTING_BASE_READ_DEPLOY_KEY }}
        run: |
          test -n "$SOURCE_READ_KEY" || { echo '::error::Missing scoped read-only accounting source capability'; exit 1; }

      - name: Checkout exact BeplyContabilidadExterna test dependency
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: beply-es/BeplyContabilidadExterna
          ref: ${{ steps.accounting_sources.outputs.base_ref }}
          ssh-key: ${{ secrets.BEPLY_ACCOUNTING_BASE_READ_DEPLOY_KEY }}
          persist-credentials: false
          path: facturascripts/Plugins/BeplyContabilidadExterna

      - name: Comprobar que la clave de lectura no queda en el runner
        if: always()
        run: bash facturascripts/Plugins/${{ env.PLUGIN_FOLDER }}/.github/ci/assert-read-key-gone.sh facturascripts/Plugins/BeplyContabilidadExterna

      - name: Prepare ARC PHP prerequisites
        run: bash facturascripts/Plugins/${{ env.PLUGIN_FOLDER }}/.github/ci/prepare-arc-php.sh

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # 2.37.0
        with:
          php-version: '8.2'
          extensions: bcmath, gd, mbstring, intl, zip, curl, pgsql, pdo_pgsql
          coverage: none

      - name: Discover e2e targets
        id: e2e-targets
        working-directory: facturascripts
        run: |
          TESTS_DIR="Plugins/${PLUGIN_FOLDER}/tests"
          if [ -f "${TESTS_DIR}/package.json" ] && find "${TESTS_DIR}/e2e" -type f -name '*.spec.ts' 2>/dev/null | grep -q .; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
            echo "tests_dir=${TESTS_DIR}" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.e2e-targets.outputs.has_tests == 'true'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'

      - name: Install Composer dependencies
        if: steps.e2e-targets.outputs.has_tests == 'true'
        working-directory: facturascripts
        env:
          COMPOSER_PROCESS_TIMEOUT: 900
        run: bash Plugins/${PLUGIN_FOLDER}/.github/ci/composer-install.sh "8.2"

      - name: Install core frontend dependencies
        if: steps.e2e-targets.outputs.has_tests == 'true'
        working-directory: facturascripts
        run: npm install --no-fund --no-audit

      - name: Start local PostgreSQL
        if: steps.e2e-targets.outputs.has_tests == 'true'
        working-directory: facturascripts
        run: bash Plugins/${PLUGIN_FOLDER}/.github/ci/start-local-postgres.sh

      - name: Prepare config.php
        if: steps.e2e-targets.outputs.has_tests == 'true'
        working-directory: facturascripts
        run: |
          cat > config.php << 'EOF'
          <?php
          define('FS_COOKIES_EXPIRE', 31536000);
          define('FS_ROUTE', '');
          define('FS_DB_TYPE', 'postgresql');
          define('FS_DB_HOST', '127.0.0.1');
          define('FS_DB_PORT', (int) getenv('PGPORT') ?: 5432);
          define('FS_DB_NAME', 'facturascripts');
          define('FS_DB_USER', 'postgres');
          define('FS_DB_PASS', 'mypassword');
          define('FS_DB_FOREIGN_KEYS', true);
          define('FS_DB_TYPE_CHECK', true);
          define('FS_PGSQL_SSL', false);
          define('FS_PGSQL_ENDPOINT', false);
          define('FS_LANG', 'es_ES');
          define('FS_TIMEZONE', 'Europe/Madrid');
          define('FS_HIDDEN_PLUGINS', '');
          define('FS_DEBUG', false);
          define('FS_DISABLE_ADD_PLUGINS', false);
          define('FS_DISABLE_RM_PLUGINS', false);
          EOF

      - name: Prepare plugin runtime
        if: steps.e2e-targets.outputs.has_tests == 'true'
        working-directory: facturascripts
        env:
          CI_PLUGIN_FOLDERS: ${{ steps.accounting_sources.outputs.runtime_plugins }}
        run: php Plugins/${PLUGIN_FOLDER}/.github/ci/setup-runtime.php

      - name: Install Playwright dependencies
        if: steps.e2e-targets.outputs.has_tests == 'true'
        working-directory: facturascripts/${{ steps.e2e-targets.outputs.tests_dir }}
        run: |
          npm ci

          PREINSTALLED_CHROMIUM="${PLAYWRIGHT_PREINSTALLED_BROWSERS_PATH:-/home/runner/.cache/ms-playwright}/chromium-1169/chrome-linux/chrome"
          if [ -x "$PREINSTALLED_CHROMIUM" ]; then
            echo "Using preinstalled ARC Chromium: $PREINSTALLED_CHROMIUM"
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$PREINSTALLED_CHROMIUM" >> "$GITHUB_ENV"
            exit 0
          fi

          npx playwright install --with-deps chromium

      - name: Start PHP server
        if: steps.e2e-targets.outputs.has_tests == 'true'
        working-directory: facturascripts
        run: |
          php -S 127.0.0.1:8765 index.php > "${GITHUB_WORKSPACE}/${PLUGIN_FOLDER}-php-server.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/${PLUGIN_FOLDER}-php-server.pid"

      - name: Wait for application
        if: steps.e2e-targets.outputs.has_tests == 'true'
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::FacturaScripts server did not start in time."
          exit 1

      - name: Run Playwright suite
        if: steps.e2e-targets.outputs.has_tests == 'true'
        working-directory: facturascripts/${{ steps.e2e-targets.outputs.tests_dir }}
        env:
          BASE_URL: http://127.0.0.1:8765
        run: npx playwright test

      - name: Upload Playwright evidence to private R2 with readback
        if: failure() && steps.e2e-targets.outputs.has_tests == 'true'
        working-directory: facturascripts/Plugins/${{ env.PLUGIN_FOLDER }}
        env:
          CI_EVIDENCE_S3_ENDPOINT: ${{ vars.CI_EVIDENCE_S3_ENDPOINT }}
          CI_EVIDENCE_S3_BUCKET: ${{ vars.CI_EVIDENCE_S3_BUCKET }}
          CI_EVIDENCE_S3_SCOPE: dev
          CI_EVIDENCE_S3_ACCESS_KEY_ID: ${{ secrets.CI_EVIDENCE_S3_ACCESS_KEY_ID }}
          CI_EVIDENCE_S3_SECRET_ACCESS_KEY: ${{ secrets.CI_EVIDENCE_S3_SECRET_ACCESS_KEY }}
          EVIDENCE_PATHS: |
            facturascripts/${{ steps.e2e-targets.outputs.tests_dir }}/playwright-report/**
            facturascripts/${{ steps.e2e-targets.outputs.tests_dir }}/test-results/**
            ${{ env.PLUGIN_FOLDER }}-php-server.log
        run: >-
          python3 scripts/ci/upload_ci_evidence.py --environment dev
          --name accounting-playwright-evidence --retention-days 1
          --path "$EVIDENCE_PATHS"

      - name: Stop PHP server
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/${PLUGIN_FOLDER}-php-server.pid" ]; then
            kill "$(cat "${RUNNER_TEMP}/${PLUGIN_FOLDER}-php-server.pid")" 2>/dev/null || true
          fi

      - name: Stop local PostgreSQL
        if: always()
        working-directory: facturascripts
        run: |
          if [ -n "${PGDATA_DIR:-}" ] && [ -f "${PGDATA_DIR}/postmaster.pid" ]; then
            if [ "${PG_RUN_AS_POSTGRES:-0}" = "1" ]; then
              runuser -u postgres -- env PATH="${PATH}" pg_ctl -D "${PGDATA_DIR}" -m fast stop
            else
              pg_ctl -D "${PGDATA_DIR}" -m fast stop
            fi
          fi
